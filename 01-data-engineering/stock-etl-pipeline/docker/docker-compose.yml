services:
  #Database PostgreSQL
  db:
    image: postgres:13
    container_name: portfolio_postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - stock-network
    restart: unless-stopped
 

 # Airflow DB
  airflow-db:
    image: postgres:13
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    networks:
      - stock-network
    restart: unless-stopped


  # Airflow Webserver
  airflow-webserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    container_name: airflow-webserver
    deploy:                           
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    environment:
      # Configuration Airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: "yNeQ5pKL-aZiFo1Ae7jzL8NWhC_NRRctFWPoGV-G_m0="
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
      PYTHONPATH: /opt/airflow
      
      # Configuration de votre base de données PostgreSQL principale
      DB_HOST: portfolio_postgres_db
      DB_PORT: 5432
      DB_NAME: portfolio_db
      DB_USER: user
      DB_PASSWORD: password
    ports:
      - "8080:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../src:/opt/airflow/src
      - ../data:/opt/airflow/data
      - ../logs:/opt/airflow/logs
      - ../requirements.txt:/opt/airflow/requirements.txt
    depends_on:
      - airflow-db
    networks:
      - stock-network
    command: webserver
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5


  # Airflow Scheduler
  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    container_name: airflow-scheduler
    deploy:                           
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    environment:
      # Configuration Airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__FERNET_KEY: "yNeQ5pKL-aZiFo1Ae7jzL8NWhC_NRRctFWPoGV-G_m0="
      AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      PYTHONPATH: /opt/airflow
      
      # Configuration de votre base de données PostgreSQL principale
      DB_HOST: portfolio_postgres_db
      DB_PORT: 5432
      DB_NAME: portfolio_db
      DB_USER: user
      DB_PASSWORD: password
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../src:/opt/airflow/src
      - ../data:/opt/airflow/data
      - ../logs:/opt/airflow/logs
      - ../requirements.txt:/opt/airflow/requirements.txt
    depends_on:
      - airflow-db
    networks:
      - stock-network
    command: scheduler
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  db_data:
  airflow-db-data:

networks:
  stock-network:
    external: true
    name: stock-shared-network
    driver: bridge